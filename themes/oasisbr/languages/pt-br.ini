# About page
about = "Sobre"
about title = "O Oasisbr"
about p1 = "O Portal Brasileiro de Publicações e Dados Científicos em Acesso Aberto (Oasisbr) é uma iniciativa do Instituto Brasileiro de Informação em Ciência e Tecnologia (Ibict) que reúne a produção científica e os dados de pesquisa em acesso aberto, publicados em revistas científicas, repositórios digitais de publicações científicas, repositórios digitais de dados de pesquisa e bibliotecas digitais de teses e dissertações."
about p2 = "Deste modo, o Oasisbr tem por objetivo reunir, dar visibilidade e acesso à boa parte dos conteúdos científicos produzidos por pesquisadores que atuam nas instituições brasileiras e portuguesas, publicados em sistemas agregadores de produção e dados científicos."
about p3 = "Por meio de uma única interface, o Oasisbr dá acesso às mais diversas tipologias documentais que contém informações científicas, a saber: artigos científicos, livros, capítulos de livros, artigos apresentados em conferências, conjuntos de dados de pesquisa, preprints, dissertações, teses, trabalhos de conclusão de curso, etc. Ademais, o Oasisbr também dá acesso ao conteúdo científico presente no "
