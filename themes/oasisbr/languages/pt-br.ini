lattes heading = "Certificação Lattes-Oasisbr"
lattes what heading = "O que é a certificação?"
lattes what p1 = "Os usuários do Currículo Lattes, do CNPq, contam com a possibilidade de terem suas teses e dissertações certificadas pelo Oasisbr - Portal Brasileiro de Publicações e Dados Científicos em Acesso Aberto. Mais de um milhão de teses e dissertações brasileiras do Currículo Lattes já contam automaticamente com o selo Oasisbr."
lattes what p2 = "O selo de certificação é exibido nas informações do currículo do usuário, nas seções de informações acadêmicas/titulação e orientações concluídas. Com o selo, é possível comprovar, de maneira rápida e simples, a autoria/orientação concluída da tese ou dissertação e acessar o documento em acesso aberto no Oasisbr. O certificado poderá ser emitido de forma automática pelo Currículo Lattes ou cadastrado manualmente pelo usuário."
lattes what p3 = "Com a nova funcionalidade, o CV Lattes poderá verificar se a tese ou dissertação inserida no currículo do pesquisador está disponível em alguma base ou repositório acadêmico. Este será o primeiro passo para outras certificações à caminho."
lattes howto heading = "Como inserir o selo do Oasisbr no Currículo Lattes?"
lattes howto p1 = "A tese ou dissertação cadastrada na plataforma Lattes poderá ser certificada apenas se o documento estiver inserido no portal Oasisbr, então, primeiramente o usuário deverá se certificar entrando no site do portal. Em um primeiro momento a certificação Lattes pelo Oasisbr pode ser realizada para Teses e Dissertações defendidas e orientadas por programas de pós-graduação brasileiros, a certificação de outros documentos acontecerá de forma gradual."
lattes howto important label = "IMPORTANTE!"
lattes howto important text = "A importação será realizada apenas se os dados do título e ano de publicação estiverem condizentes, tanto no Oasisbr quanto no seu currículo Lattes."
lattes howto p3 part1 = "Se o documento não estiver cadastrado no Portal Oasis, pedimos que notifique a instituição depositante, solicitando o cadastramento do repositório junto ao nosso portal através do e-mail"
lattes howto p4 = "Ao acessar o seu espaço de edição do Currículo Lattes e inserir os dados de uma tese ou dissertação, o pesquisador ou acadêmico pode importar informações do Oasisbr pelo seu ID Lattes ou número do ORCID e verificar quais são os documentos cadastrados no Oasisbr. Os dados importados já vem com o selo para serem exibidos automaticamente no perfil público. Ao clicar no selo, o usuário poderá acessar o documento no Oasisbr."
