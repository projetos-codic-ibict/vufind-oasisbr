dark_t4 = "Interoperabilidade com resolutores ARK globais e convivência com outros PIDs (por exemplo, DOI), preservando vínculos e referências."
dark_t5 = "Governança distribuída em consórcio institucional, aumentando resiliência e tolerância a falhas."
dark_t6 = "Transparência e proveniência dos metadados, favorecendo auditoria, reprodutibilidade e preservação de longo prazo."
