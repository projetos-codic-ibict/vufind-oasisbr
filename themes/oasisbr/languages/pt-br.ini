# Goals
Goals = "Objetivos"
goal 1 = "Contribuir para o aumento da visibilidade da produção científica pesquisadores das instituições brasileiras e portuguesas, nacional e internacionalmente;"
goal 2 = "Oferecer aos mais diferentes profissionais envolvidos com a comunicação científica, acesso aberto e rápido a um grande volume da produção científica e de conjuntos dados de pesquisa qualificados;"
goal 3 = "Favorecer o aumento do intercâmbio científico entre pesquisadores, nacional e internacionalmente;"
goal 4 = "Estimular a criação de plataformas científicas em acesso aberto, tais como: revistas científicas, repositórios digitais de publicações científicas, repositórios digitais de dados de pesquisa e bibliotecas digitais de teses e dissertações;"
goal 5 = "Estimular a adoção das práticas da Ciência Aberta no contexto da comunicação científica nacional;"
goal 6 = "Fornecer dados e informações confiáveis que evitem a duplicação de esforços e recursos para o desenvolvimento da pesquisa;"
goal 7 = "Atuar como provedor nacional de plataformas científicas em acesso aberto, coletando e dando acesso às mais diferentes tipologias documentais;"

