faq2 p1a = "Para que seu documento possa ser coletado pelo Oasisbr é essencial que ele esteja disponível em umas das fontes de informação científica coletadas pelo Portal. Consulte a página"
faq2 p1b = "para verificar se a fonte de informação em que seu documento foi publicado já faz parte do Oasisbr."
faq2 p2 = "Caso a fonte de informação em que se encontra o seu documento ainda não seja coletada pelo Oasisbr, sugerimos que, inicialmente, entre em contato com o gestor da fonte para que ele possa acionar a equipe do Portal Oasisbr."

faq3 p1a = "Cada tipo de fonte de informação científica possui um conjunto distinto de critérios para coleta, que podem ser consultadas na página"
faq3 p1b = "em “Critérios para coleta de fontes de informação”. Após o gestor da fonte verificar os critérios de coleta ele deverá entrar em contato com a equipe do Portal Oasisbr por meio do formulário de"
faq3 link contato = "Contato"
faq3 p1c = "e solicitar sua adesão ao Portal."

faq4 p1a = "Sendo coletada pelo Oasisbr, a fonte de informação e todos os conteúdos por ela disponibilizados passam a ter visibilidade nacional, uma vez que o Oasisbr agrega em um único portal grande parte da produção científica brasileira, e internacional, pois o Oasisbr é coletado por grandes bases internacionais e disseminado a nível mundial. Saiba mais a respeito do “Fluxo informacional do Oasisbr” na aba"

faq5 p1a = "O Oasisbr coleta, dissemina e dá acesso a todo conteúdo disponibilizado na"
faq5 link bdtd = "Biblioteca Digital Brasileira de Teses e Dissertações (BDTD)"
faq5 p1b = ". Ademais, o Oasisbr dá acesso ao conteúdo científico presente no"
faq5 link rcaap = "Repositório Científico de Acesso Aberto de Portugal (RCAAP)"
faq5 p1c = ", e os conteúdos disponibilizados pelo RCAAP são coletados pelo Oasisbr e apresentado para a comunidade científica brasileira. Os conteúdos agregados pelo Oasisbr são coletados, também, pela"
faq5 link lareferencia = "Rede de Repositorios de Acceso Abierto a la Ciencia (LA Referencia)"
faq5 p1d = ", que por sua vez é coletada pelo agregador europeu"
faq5 p1e = ". Essa rede de informação possibilita que o Oasisbr cumpra sua missão primordial, de aumentar o impacto da Ciência brasileira mundo afora."

faq6 p1 = "O Oasisbr não se responsabiliza pela gestão dos documentos publicados e/ou depositados nas fontes de informação que coleta. Portanto, se você encontrou um documento de sua autoria e acredita que ele não deva estar no Oasisbr, entre em contato diretamente com a fonte em que ele foi publicado. Somente após a atualização do registro do documento diretamente na fonte é que ele deixará de aparecer no Oasisbr."
faq6 p2 = "Lembramos que o Oasisbr somente coleta documentos que foram publicados em acesso aberto e que todas as questões relativas a direitos autorais são acordadas diretamente entre o(s) autor(es) e a fonte em que seu trabalho foi publicado e/ou depositado."

faq7 p1 = "Para exportar dados dos registros do Oasisbr é preciso, inicialmente, realizar uma busca para filtrar os registros desejados. Diante do resultado da busca basta clicar no botão “Exportar” que se encontra no início e ao final da página de busca e indicar o email para o envio do arquivo, os registros serão então enviados para o email indicado no formato CSV."
faq7 p2a = "Para o gerenciamento de referências indica-se a utilização do software livre Zotero. O Zotero é compatível com o Oasisbr e permite a exportação de documentos e suas referências diretamente do portal. Confira o"
faq7 link zotero manual = "manual simplificado de utilização do Zotero"

faq8 p1 = "Há duas maneiras de recuperar o registro de uma fonte de informação científica no Oasisbr. São elas:"
faq8 li1a = "Na página"
faq8 li1b = ", localizado no menu superior, é possível acessar todas as fontes de informação científica coletadas pelo Oasisbr utilizando a barra de busca. A busca pode ser feita tanto por “Todas as fontes” quanto por tipologias específicas."
faq8 li2a = "Na"
faq8 link pagina inicial = "página inicial do Oasisbr"
faq8 li2b = ", com a barra de busca em branco, clique em “Buscar”. Feito isso, utilize os filtros “Instituições” e depois “Título da fonte”, à esquerda da página do resultado da busca. Por fim, basta identificar sua Instituição e/ou o título da fonte da sua plataforma."

faq9 p1a = "O Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) é um protocolo desenvolvido pela"
faq9 link oai = "Open Archives Initiative"
faq9 p1b = "que define um mecanismo para coleta de registros de metadados de eprints, bibliotecas digitais ou qualquer servidor na rede que queira compartilhar ou tornar visíveis metadados de documentos nele armazenados para programas externos coletá-los. Este protocolo foi escolhido pelo Oasisbr por ser uma opção simples e eficiente para que as fontes de informação façam validação e coleta dos metadados dos arquivos inseridos em sua plataforma."

faq10 p1a = "As Diretrizes da Digital Repository Infrastructure Vision for European Research (DRIVE) orientam a definição de metadados e o preenchimento destes visando uma maior interoperabilidade e qualidade das informações intercambiadas. No caso do Oasisbr, utilizamos o"
faq10 link drive vocab = "vocabulário controlado DRIVE"
faq10 p1b = "para o campo dc.type, ou seja, para que os itens disponíveis no repositório de publicações científicas sejam validados e espelhados no Portal é necessário que o campo dc.type seja preenchido de acordo com o vocabulário controlado abaixo:"

faq11 p1 = "Alguns dos problemas mais comuns identificados na coleta de fontes de informação são:"
faq11 li1 = "Alteração de endereço eletrônico (link) da página da fonte;"
faq11 li2 = "Desatualização da URL OAI-PMH da fonte;"
faq11 li3 = "Atualização de informações (inclusão ou exclusão de arquivos) da fonte sem informar à equipe do Oasisbr;"
faq11 li4a = "Erros de indexação de documentos diretamente da fonte, tais como: erro de operação de coleta com o metadado; metadado fora do padrão exigido; não utilizar a"
faq11 link drive list = "lista de tipos válidos do vocabulário controlado DRIVE"
faq11 li4b = "; entre outros."
faq11 li5 = "Exigir login e senha para acesso de arquivos na plataforma;"
faq11 li6 = "Erro ou queda de conexão do servidor da plataforma;"
faq11 li7 = "Bloqueio via proxy da instituição, impedindo que o Oasisbr faça a coleta."

faq12 p1a = "Para entrar em contato com um de nossos colaboradores, envie um email para o endereço"
faq12 p1b = "ou entre em contato através do telefone"
faq12 p1c = "(atendimento apenas no horário das 10h às 12h e 14h às 16h, horário de Brasília)."




faq13 p1 = "O Portal Brasileiro de Publicações e Dados Científicos em Acesso Aberto – Oasisbr é uma iniciativa do Instituto Brasileiro de Informação em Ciência e Tecnologia (Ibict) destinada a reunir e ampliar a visibilidade da produção científica disponibilizada por instituições e fontes de informação integradas ao Portal."

faq13 p2 = "O acesso ao Oasisbr é público e gratuito."

faq13 p3 = "As informações apresentadas no Portal são obtidas a partir das fontes de informação integradas ao Oasisbr e podem passar por processos técnicos de coleta, validação, transformação, normalização e indexação para possibilitar sua recuperação de forma integrada."
faq13 p4 = "A responsabilidade pelo conteúdo dos documentos, bem como pela exatidão e atualização dos metadados originalmente disponibilizados, permanece vinculada às respectivas instituições e fontes de origem."

faq13 p5 = "A utilização dos conteúdos recuperados por meio do Oasisbr deve observar as condições de acesso, uso, licenciamento e direitos autorais estabelecidas pela fonte responsável pelo documento."

faq13 p6 = "O usuário compromete-se a utilizar o Portal de forma lícita e compatível com sua finalidade, abstendo-se de realizar ações que possam comprometer sua disponibilidade, segurança ou funcionamento."

faq13 p7 = "Para informações sobre funcionamento, integração de fontes, recuperação de conteúdos e outras questões relacionadas ao Portal, consulte também a seção Perguntas Frequentes (FAQ) do Oasisbr."

faq13 p8 = "Para informações gerais sobre direitos e responsabilidades relacionados aos serviços digitais do Governo Federal, consulte também os"

faq learn more = "Saiba mais:"

faq13 learn more text = ""

faq13 govbr terms link = "Termos de Uso do Gov.br"


faq14 p1 = "O Instituto Brasileiro de Informação em Ciência e Tecnologia – Ibict reconhece a importância da privacidade e da proteção dos dados pessoais dos usuários do Portal Brasileiro de Publicações e Dados Científicos em Acesso Aberto – Oasisbr."

faq14 p2 = "O tratamento de dados eventualmente realizado no âmbito do Portal observa a legislação brasileira aplicável, especialmente a Lei nº 13.709/2018 – Lei Geral de Proteção de Dados Pessoais (LGPD), bem como os princípios da finalidade, adequação, necessidade, transparência, segurança e prevenção."

faq14 p3 = "O Oasisbr tem como finalidade principal possibilitar a busca e o acesso integrado à produção científica disponibilizada por instituições e fontes de informação participantes. Para isso, realiza processos automatizados de coleta, tratamento, normalização e indexação de metadados provenientes dessas fontes."

faq14 p4 = "Os metadados apresentados pelo Oasisbr têm origem nas instituições provedoras de dados. Dessa forma, eventuais solicitações relacionadas à correção ou atualização do conteúdo original poderão exigir alteração diretamente na respectiva fonte de informação."

faq14 p5 = "Durante a utilização do Portal poderão ser tratados dados técnicos necessários ao seu funcionamento e à segurança dos serviços, bem como informações armazenadas por meio de cookies. Quando houver utilização de cookies não estritamente necessários, serão disponibilizadas ao usuário informações sobre sua finalidade e, quando aplicável, mecanismos para gerenciamento de suas preferências."

faq14 p6 = "O Oasisbr busca adotar medidas técnicas e administrativas destinadas à proteção das informações tratadas no âmbito da plataforma."

faq14 p7 = "Para informações adicionais sobre o funcionamento do Portal, coleta de registros e integração das fontes de informação, consulte a seção Perguntas Frequentes (FAQ) do Oasisbr."

faq14 learn more text = "Informações gerais sobre privacidade e proteção de dados nos serviços digitais do Governo Federal podem ser consultadas na"

faq14 privacy policy link = "Política de Privacidade do Gov.br"

faq14 page intro = "A Política de Privacidade do Oasisbr, incluindo as informações sobre cookies, está disponível nesta página."
faq14 page link = "Acessar a Política de Privacidade"

