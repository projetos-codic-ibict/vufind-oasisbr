privacy cookies p2 = "Cookies são pequenos arquivos armazenados no dispositivo utilizado para acessar o Portal. Eles podem desempenhar diferentes funções, como manter determinadas preferências de navegação, permitir o funcionamento adequado de recursos da plataforma e, quando aplicável, produzir informações estatísticas sobre a utilização do Portal."
