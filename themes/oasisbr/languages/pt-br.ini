home_faq_reuse_question = "É possível reutilizar os dados do portal?"
home_faq_reuse_answer = "Sim. Os metadados estão disponíveis para colheita via OAI-PMH e podem ser reutilizados em serviços de terceiros, respeitando a atribuição da fonte."


