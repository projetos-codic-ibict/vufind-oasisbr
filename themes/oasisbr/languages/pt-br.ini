#dark - Decentralized Archival Resource Key
dark_title = "dARK — Decentralized Archival Resource Key"
dark_t1 = "O dARK é uma iniciativa aberta e gratuita, coordenada pelo Ibict e LA Referencia em colaboração com parceiros regionais, que estende o identificador ARK (Archival Resource Key) para um modelo descentralizado de atribuição e resolução de PIDs, baseado em rede blockchain permissionada. Integrado ao ecossistema do Oasisbr, o dARK busca ampliar a cobertura de identificadores persistentes no Brasil e no Sul Global, reduzir custos operacionais, reforçar a governança compartilhada e assegurar persistência, proveniência e interoperabilidade dos registros ao longo do tempo.
Saiba mais em: "
