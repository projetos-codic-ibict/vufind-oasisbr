home_faq_full_text_question = "O Oasisbr armazena os textos completos?"
home_faq_full_text_answer = "Não. O portal coleta e indexa apenas os metadados. O acesso ao texto completo é feito diretamente no repositório ou na revista de origem, pelo link presente em cada registro."
home_faq_update_question = "Com que frequência os registros são atualizados?"
home_faq_update_answer = "A colheita dos provedores de dados ocorre em ciclos regulares. Novos documentos depositados costumam aparecer no portal em até 30 dias."
home_faq_correction_question = "Como corrigir um metadado incorreto?"
