faq15 p1 = "O Portal Brasileiro de Publicações e Dados Científicos em Acesso Aberto – Oasisbr busca promover o acesso amplo e inclusivo às informações científicas disponibilizadas em sua plataforma."

faq15 p2 = "O desenvolvimento e a evolução do Portal consideram boas práticas e diretrizes de acessibilidade digital, com o objetivo de permitir que seus conteúdos e funcionalidades possam ser utilizados pelo maior número possível de pessoas, independentemente de suas capacidades, dispositivos ou tecnologias assistivas utilizadas."

faq15 p3 = "A nova versão do Oasisbr incorpora requisitos de acessibilidade relacionados, entre outros aspectos, à navegação por teclado, estruturação adequada dos conteúdos, identificação de elementos de interface, contraste, legibilidade e compatibilidade com tecnologias assistivas."

faq15 p4 = "A acessibilidade constitui um processo contínuo. Por esse motivo, o Portal poderá receber aprimoramentos à medida que forem identificadas novas necessidades, atualizações tecnológicas ou oportunidades de melhoria."

faq15 p5 = "Caso o usuário encontre alguma barreira de acessibilidade durante a utilização do Oasisbr, recomenda-se comunicá-la à equipe responsável pelo Portal por meio dos canais institucionais de atendimento, informando, sempre que possível, a página, funcionalidade ou conteúdo em que ocorreu a dificuldade."

faq15 p6 = "Para outras informações sobre o funcionamento e a utilização do Portal, consulte também a seção Perguntas Frequentes (FAQ) do Oasisbr."

