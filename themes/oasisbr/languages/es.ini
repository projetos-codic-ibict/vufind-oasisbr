dark heading = "dARK — Decentralized Archival Resource Key"
dark intro p1 = "dARK es una iniciativa abierta y gratuita, coordinada por Ibict y LA Referencia en colaboración con socios regionales, que amplía el identificador ARK (Archival Resource Key) a un modelo descentralizado de asignación y resolución de PID, basado en una red blockchain permisionada. Integrado al ecosistema de Oasisbr, dARK busca ampliar la cobertura de identificadores persistentes en Brasil y en el Sur Global, reducir los costes operativos, reforzar la gobernanza compartida y asegurar la persistencia, la procedencia y la interoperabilidad de los registros a lo largo del tiempo."
dark intro link = "Más información sobre dARK en el sitio web oficial"
dark features title = "Características principales"
dark feature 1 = "Bajo coste y escalabilidad para la asignación de ARK a gran escala, con énfasis en instituciones de países del Sur Global."
dark feature 2 = "Interoperabilidad con resolvedores ARK globales y coexistencia con otros PID (por ejemplo, DOI), preservando vínculos y referencias."
dark feature 3 = "Gobernanza distribuida en un consorcio institucional, que aumenta la resiliencia y la tolerancia a fallos."
dark feature 4 = "Transparencia y procedencia de los metadatos, favoreciendo la auditoría, la reproducibilidad y la preservación a largo plazo."
dark purpose title = "Finalidad en Oasisbr"
dark purpose li1 = "Al integrarse en Oasisbr, dARK potencia la visibilidad, la fiabilidad y la longevidad de los objetos digitales agregados, alineándose con las prácticas de Ciencia Abierta y fortaleciendo la infraestructura nacional de comunicación científica."
dark purpose li2 part1 = "Si su fuente ya forma parte de Oasisbr, descargue la"
dark purpose li2 link = "carta de adhesión a dARK"
dark purpose li2 part2 = "y envíela al correo electrónico"
lattes heading = "Certificación Lattes-Oasisbr"
lattes what heading = "¿Qué es la certificación?"
lattes what p1 = "Los usuarios del Currículo Lattes, de CNPq, pueden certificar sus tesis y disertaciones mediante Oasisbr - Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto. Más de un millón de tesis y disertaciones brasileñas del Currículo Lattes ya cuentan automáticamente con el sello Oasisbr."
lattes what p2 = "El sello de certificación se muestra en la información curricular del usuario, en las secciones de información académica/titulación y orientaciones concluidas. Con el sello, es posible comprobar de manera rápida y sencilla la autoría/orientación concluida de la tesis o disertación y acceder al documento en acceso abierto en Oasisbr. El certificado puede emitirse automáticamente por el Currículo Lattes o ser registrado manualmente por el usuario."
lattes what p3 = "Con la nueva funcionalidad, el CV Lattes podrá comprobar si la tesis o disertación incluida en el currículo del investigador está disponible en alguna base de datos o repositorio académico. Este será el primer paso para otras certificaciones futuras."
lattes howto heading = "¿Cómo incluir el sello de Oasisbr en el Currículo Lattes?"
lattes howto p1 = "La tesis o disertación registrada en la plataforma Lattes solo podrá certificarse si el documento está incluido en el portal Oasisbr; por ello, el usuario debe comprobarlo primero en el sitio web del portal. Inicialmente, la certificación Lattes mediante Oasisbr puede realizarse para tesis y disertaciones defendidas y dirigidas por programas brasileños de posgrado; la certificación de otros documentos se realizará gradualmente."
lattes howto important label = "¡IMPORTANTE!"
lattes howto important text = "La importación solo se realizará si los datos del título y del año de publicación coinciden, tanto en Oasisbr como en su currículo Lattes."
lattes howto p3 part1 = "Si el documento no está registrado en el Portal Oasis, solicitamos que notifique a la institución depositante y pida el registro del repositorio en nuestro portal a través del correo electrónico"
lattes howto p4 = "Al acceder al área de edición de su Currículo Lattes e introducir los datos de una tesis o disertación, el investigador o académico puede importar información de Oasisbr mediante su ID Lattes o número ORCID y comprobar qué documentos están registrados en Oasisbr. Los datos importados ya incluyen el sello para mostrarse automáticamente en el perfil público. Al hacer clic en el sello, el usuario podrá acceder al documento en Oasisbr."
lattes howto download aria label = "Descargar la guía paso a paso para la certificación Lattes-Oasisbr (archivo PDF)"
lattes howto download link = "Descargar guía paso a paso para la certificación (PDF)"
