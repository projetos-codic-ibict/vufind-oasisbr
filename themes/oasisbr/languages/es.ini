faq1 p1 = "El Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto (Oasisbr) es una iniciativa del Instituto Brasileño de Información en Ciencia y Tecnología (Ibict) que reúne la producción científica y los datos de investigación en acceso abierto de diversas universidades e instituciones de investigación brasileñas y portuguesas. Obtenga más información sobre Oasisbr en la página"
faq1 link sobre = "Acerca de"
faq2 p1a = "Para que Oasisbr recopile su documento, es esencial que esté disponible en una de las fuentes de información científica recopiladas por el Portal. Consulte la página"
faq2 p1b = "para comprobar si la fuente de información en la que se publicó su documento ya forma parte de Oasisbr."
faq2 p2 = "Si la fuente de información en la que se encuentra su documento aún no es recopilada por Oasisbr, le sugerimos que primero contacte con la persona responsable de la fuente para que pueda ponerse en contacto con el equipo del Portal Oasisbr."
faq3 p1a = "Cada tipo de fuente de información científica posee un conjunto diferente de criterios de recopilación, que pueden consultarse en la página"
faq3 p1b = "en “Criterios para la recopilación de fuentes de información”. Después de que la persona responsable de la fuente compruebe los criterios, deberá ponerse en contacto con el equipo del Portal Oasisbr mediante el formulario de"
faq3 link contato = "Contacto"
faq3 p1c = "y solicitar su adhesión al Portal."
faq4 p1a = "Al ser recopilada por Oasisbr, la fuente de información y todos los contenidos que proporciona obtienen visibilidad nacional, ya que Oasisbr reúne en un único portal una gran parte de la producción científica brasileña, e internacional, pues Oasisbr es recopilado por importantes bases internacionales y difundido a nivel mundial. Obtenga más información sobre el “Flujo de información de Oasisbr” en la pestaña"
faq5 p1a = "Oasisbr recopila, difunde y da acceso a todo el contenido disponible en la"
faq5 link bdtd = "Biblioteca Digital Brasileña de Tesis y Disertaciones (BDTD)"
faq5 p1b = ". Además, Oasisbr da acceso al contenido científico presente en el"
faq5 link rcaap = "Repositorio Científico de Acceso Abierto de Portugal (RCAAP)"
faq5 p1c = ", y los contenidos proporcionados por RCAAP son recopilados por Oasisbr y presentados a la comunidad científica brasileña. Los contenidos agregados por Oasisbr también son recopilados por la"
faq5 link lareferencia = "Red de Repositorios de Acceso Abierto a la Ciencia (LA Referencia)"
faq5 p1d = ", que a su vez es recopilada por el agregador europeo"
faq5 p1e = ". Esta red de información permite a Oasisbr cumplir su misión principal de aumentar el impacto de la ciencia brasileña en todo el mundo."
faq6 p1 = "Oasisbr no es responsable de la gestión de los documentos publicados y/o depositados en las fuentes de información que recopila. Por ello, si encontró un documento de su autoría y considera que no debería estar en Oasisbr, contacte directamente con la fuente en la que fue publicado. Solo después de actualizar el registro del documento directamente en la fuente dejará de aparecer en Oasisbr."
faq6 p2 = "Recordamos que Oasisbr solo recopila documentos publicados en acceso abierto y que todas las cuestiones relativas a derechos de autor se acuerdan directamente entre el autor o los autores y la fuente en la que se publicó y/o depositó su trabajo."
faq7 p1 = "Para exportar datos de los registros de Oasisbr, primero debe realizar una búsqueda para filtrar los registros deseados. En el resultado de la búsqueda, haga clic en el botón “Exportar”, situado al inicio y al final de la página de búsqueda, e indique el correo electrónico para enviar el archivo; los registros se enviarán al correo indicado en formato CSV."
faq7 p2a = "Para la gestión de referencias se recomienda utilizar el software libre Zotero. Zotero es compatible con Oasisbr y permite exportar documentos y sus referencias directamente desde el portal. Consulte el"
faq7 link zotero manual = "manual simplificado de uso de Zotero"
faq8 p1 = "Hay dos formas de recuperar el registro de una fuente de información científica en Oasisbr:"
faq8 li1a = "En la página"
faq8 li1b = ", ubicada en el menú superior, es posible acceder a todas las fuentes de información científica recopiladas por Oasisbr mediante la barra de búsqueda. La búsqueda puede realizarse tanto por “Todas las fuentes” como por tipologías específicas."
faq8 li2a = "En la"
faq8 link pagina inicial = "página inicial de Oasisbr"
faq8 li2b = ", con la barra de búsqueda vacía, haga clic en “Buscar”. A continuación, utilice los filtros “Instituciones” y luego “Título de la fuente”, a la izquierda de la página de resultados. Por último, identifique su institución y/o el título de la fuente de su plataforma."
faq9 p1a = "El Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) es un protocolo desarrollado por la"
faq9 link oai = "Open Archives Initiative"
faq9 p1b = "que define un mecanismo para recopilar registros de metadatos de eprints, bibliotecas digitales o cualquier servidor de la red que desee compartir o hacer visibles los metadatos de documentos almacenados en él para que programas externos los recopilen. Oasisbr eligió este protocolo porque es una opción sencilla y eficiente para que las fuentes de información validen y recopilen los metadatos de los archivos incorporados en su plataforma."
faq10 p1a = "Las directrices de Digital Repository Infrastructure Vision for European Research (DRIVE) orientan la definición y cumplimentación de metadatos para lograr una mayor interoperabilidad y calidad de la información intercambiada. En Oasisbr utilizamos el"
faq10 link drive vocab = "vocabulario controlado DRIVER"
faq10 p1b = "para el campo dc.type; es decir, para que los ítems disponibles en el repositorio de publicaciones científicas sean validados y reflejados en el Portal, el campo dc.type debe cumplimentarse de acuerdo con el siguiente vocabulario controlado:"
faq11 p1 = "Algunos de los problemas más comunes identificados en la recopilación de fuentes de información son:"
faq11 li1 = "Cambio de dirección electrónica (enlace) de la página de la fuente;"
faq11 li2 = "Desactualización de la URL OAI-PMH de la fuente;"
faq11 li3 = "Actualización de información de la fuente (inclusión o eliminación de archivos) sin informar al equipo de Oasisbr;"
faq11 li4a = "Errores de indexación de documentos directamente desde la fuente, tales como: error de operación de recopilación con el metadato; metadato fuera del estándar requerido; no utilizar la"
faq11 link drive list = "lista de tipos válidos del vocabulario controlado DRIVER"
faq11 li4b = "; entre otros."
faq11 li5 = "Exigir inicio de sesión y contraseña para acceder a archivos en la plataforma;"
faq11 li6 = "Error o caída de la conexión del servidor de la plataforma;"
faq11 li7 = "Bloqueo mediante proxy de la institución, que impide que Oasisbr realice la recopilación."
faq12 p1a = "Para contactar con uno de nuestros colaboradores, envíe un correo electrónico a la dirección"
faq12 p1b = "o contacte por teléfono"
faq12 p1c = "(atención únicamente de 10:00 a 12:00 y de 14:00 a 16:00, horario de Brasilia)."
faq13 p1 = "El Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto – Oasisbr es una iniciativa del Instituto Brasileño de Información en Ciencia y Tecnología (Ibict) destinada a reunir y ampliar la visibilidad de la producción científica disponible en instituciones y fuentes de información integradas en el Portal."
faq13 p2 = "El acceso a Oasisbr es público y gratuito."
faq13 p3 = "La información presentada en el Portal se obtiene de fuentes de información integradas en Oasisbr y puede someterse a procesos técnicos de recopilación, validación, transformación, normalización e indexación para posibilitar su recuperación integrada."
faq13 p4 = "La responsabilidad por el contenido de los documentos, así como por la exactitud y actualización de los metadatos proporcionados originalmente, permanece vinculada a las respectivas instituciones y fuentes de origen."
faq13 p5 = "El uso de los contenidos recuperados mediante Oasisbr debe observar las condiciones de acceso, uso, licencias y derechos de autor establecidas por la fuente responsable del documento."
faq13 p6 = "El usuario se compromete a utilizar el Portal de forma lícita y compatible con su finalidad, absteniéndose de realizar acciones que puedan comprometer su disponibilidad, seguridad o funcionamiento."
faq13 p7 = "Para obtener información sobre el funcionamiento, la integración de fuentes, la recuperación de contenidos y otras cuestiones relacionadas con el Portal, consulte también la sección Preguntas frecuentes (FAQ) de Oasisbr."
faq13 p8 = "Para obtener información general sobre derechos y responsabilidades relacionados con los servicios digitales del Gobierno Federal, consulte también los"
faq13 govbr terms link = "Términos de uso de Gov.br"
faq learn more = "Más información:"
faq14 p1 = "El Instituto Brasileño de Información en Ciencia y Tecnología – Ibict reconoce la importancia de la privacidad y de la protección de los datos personales de los usuarios del Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto – Oasisbr."
faq14 p2 = "El tratamiento de datos que eventualmente se realice en el ámbito del Portal observa la legislación brasileña aplicable, especialmente la Ley n.º 13.709/2018 – Ley General de Protección de Datos Personales (LGPD), así como los principios de finalidad, adecuación, necesidad, transparencia, seguridad y prevención."
faq14 p3 = "La finalidad principal de Oasisbr es posibilitar la búsqueda y el acceso integrado a la producción científica disponible por instituciones y fuentes de información participantes. Para ello, realiza procesos automatizados de recopilación, tratamiento, normalización e indexación de metadatos procedentes de esas fuentes."
faq14 p4 = "Los metadatos presentados por Oasisbr proceden de las instituciones proveedoras de datos. Por ello, las solicitudes relacionadas con la corrección o actualización del contenido original pueden requerir cambios directamente en la respectiva fuente de información."
faq14 p5 = "Durante el uso del Portal pueden tratarse datos técnicos necesarios para su funcionamiento y la seguridad de los servicios, así como información almacenada mediante cookies. Cuando se utilicen cookies no estrictamente necesarias, se proporcionará al usuario información sobre su finalidad y, cuando corresponda, mecanismos para gestionar sus preferencias."
faq14 p6 = "Oasisbr busca adoptar medidas técnicas y administrativas destinadas a proteger la información tratada en el ámbito de la plataforma."
faq14 p7 = "Para obtener información adicional sobre el funcionamiento del Portal, la recopilación de registros y la integración de fuentes de información, consulte la sección Preguntas frecuentes (FAQ) de Oasisbr."
faq14 learn more text = "La información general sobre privacidad y protección de datos en los servicios digitales del Gobierno Federal puede consultarse en la"
faq14 privacy policy link = "Política de privacidad de Gov.br"
faq15 p1 = "El Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto – Oasisbr busca promover un acceso amplio e inclusivo a la información científica disponible en su plataforma."
faq15 p2 = "El desarrollo y la evolución del Portal consideran buenas prácticas y directrices de accesibilidad digital, con el objetivo de permitir que sus contenidos y funcionalidades sean utilizados por el mayor número posible de personas, independientemente de sus capacidades, dispositivos o tecnologías de apoyo."
faq15 p3 = "La nueva versión de Oasisbr incorpora requisitos de accesibilidad relacionados, entre otros aspectos, con la navegación por teclado, la estructuración adecuada de contenidos, la identificación de elementos de la interfaz, el contraste, la legibilidad y la compatibilidad con tecnologías de apoyo."
faq15 p4 = "La accesibilidad es un proceso continuo. Por ello, el Portal puede recibir mejoras a medida que se identifiquen nuevas necesidades, actualizaciones tecnológicas u oportunidades de perfeccionamiento."
faq15 p5 = "Si un usuario encuentra alguna barrera de accesibilidad al utilizar Oasisbr, se le recomienda comunicarla al equipo responsable del Portal a través de los canales institucionales de atención, proporcionando, siempre que sea posible, información sobre la página, funcionalidad o contenido en el que se produjo la dificultad."
faq15 p6 = "Para obtener más información sobre el funcionamiento y el uso del Portal, consulte también la sección Preguntas frecuentes (FAQ) de Oasisbr."
faq15 learn more = "Más información:"
faq15 learn more text1 = "También puede consultar las orientaciones sobre"
faq15 accessibility digital link = "Accesibilidad digital del Gobierno Federal"
faq15 learn more text2 = "y el"
faq15 emag link = "Modelo de Accesibilidad en Gobierno Electrónico (eMAG)"
faq16 p1 = "El Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto – Oasisbr utiliza cookies y tecnologías similares para garantizar el adecuado funcionamiento de la plataforma y mejorar la experiencia de navegación de los usuarios."
faq16 p2 = "Las cookies son pequeños archivos almacenados en el dispositivo utilizado para acceder al Portal. Pueden desempeñar distintas funciones, como mantener determinadas preferencias de navegación, permitir el funcionamiento adecuado de recursos de la plataforma y, cuando corresponda, generar información estadística sobre el uso del Portal."
faq16 categories intro = "Las cookies utilizadas pueden clasificarse en las siguientes categorías:"
faq16 necessary label = "Cookies necesarias:"
faq16 necessary description = "son esenciales para el funcionamiento adecuado del Portal y para la disponibilidad de sus recursos. Por esta razón, no pueden desactivarse mediante la configuración del Portal."
faq16 preference label = "Cookies de preferencias:"
faq16 preference description = "cuando se utilizan, permiten conservar las elecciones realizadas durante la navegación y proporcionar una experiencia de usuario más adecuada."
faq16 analytics label = "Cookies analíticas o de rendimiento:"
faq16 analytics description = "cuando se utilizan, permiten recopilar información estadística sobre el uso del Portal, contribuyendo a la evaluación y mejora de sus servicios. Cuando corresponda, su uso está sujeto a las opciones de consentimiento puestas a disposición del usuario."
faq16 preferences = "Los usuarios pueden revisar o modificar sus preferencias de cookies, cuando estén disponibles, a través de esta página."
faq16 legal = "Oasisbr observa los principios de privacidad, protección de datos personales y transparencia establecidos en la legislación brasileña aplicable, especialmente en la Ley General de Protección de Datos Personales – LGPD (Ley n.º 13.709/2018)."
