; Página Sobre Oasisbr
About = "Acerca de"
home_hero_kicker = "Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto"
about p1 = "El Portal Brasileño de Publicaciones y Datos Científicos en Acceso Abierto (Oasisbr) es una iniciativa del Instituto Brasileño de Información en Ciencia y Tecnología (Ibict) que reúne la producción científica y los datos de investigación en acceso abierto, publicados en revistas científicas, repositorios digitales de publicaciones científicas, repositorios digitales de datos de investigación y bibliotecas digitales de tesis y disertaciones."
about p2 = "De este modo, Oasisbr tiene como objetivo reunir, dar visibilidad y acceso a una parte importante de los contenidos científicos producidos por investigadores que trabajan en instituciones brasileñas y portuguesas, publicados en sistemas agregadores de producción y datos científicos."
about p3 = "A través de una única interfaz, Oasisbr proporciona acceso a los más diversos tipos de documentos que contienen información científica, tales como: artículos científicos, libros, capítulos de libros, artículos presentados en congresos, conjuntos de datos de investigación, preprints, disertaciones, tesis, trabajos de fin de carrera, etc. Además, Oasisbr también proporciona acceso al contenido científico presente en el "
about link rcaap = "Repositorio Científico de Acceso Abierto de Portugal (RCAAP)"
about link rcaap aria label = "RCAAP - Red de Repositorios Científicos de Acceso Abierto de Portugal"
Goals = "Objetivos"
goal 1 = "Contribuir al aumento de la visibilidad de la producción científica de investigadores de instituciones brasileñas y portuguesas, nacional e internacionalmente;"
goal 2 = "Ofrecer a los diversos profesionales involucrados en la comunicación científica acceso abierto y rápido a un gran volumen de producción científica y conjuntos de datos de investigación cualificados;"
goal 3 = "Favorecer el aumento del intercambio científico entre investigadores, nacional e internacionalmente;"
goal 4 = "Estimular la creación de plataformas científicas de acceso abierto, tales como revistas científicas, repositorios digitales de publicaciones científicas, repositorios digitales de datos de investigación y bibliotecas digitales de tesis y disertaciones;"
goal 5 = "Estimular la adopción de prácticas de Ciencia Abierta en el contexto de la comunicación científica nacional;"
goal 6 = "Proporcionar datos e información fiables que eviten la duplicación de esfuerzos y recursos para el desarrollo de la investigación;"
goal 7 = "Actuar como proveedor nacional de plataformas científicas de acceso abierto, recopilando y proporcionando acceso a los más diversos tipos de documentos;"
Oasisbr information flow = "Flujo de información de Oasisbr"
flow p1 = "Para agregar en un único portal la producción científica nacional en acceso abierto, Oasisbr utiliza una plataforma que, periódicamente, recopila los contenidos proporcionados por los proveedores que integran Oasisbr."
flow p2 = "Los contenidos agregados por Oasisbr también son recopilados por el "
flow p3 = "y, del mismo modo, determinados tipos de contenidos proporcionados por RCAAP son recopilados por Oasisbr y puestos a disposición de la comunidad científica brasileña. Los contenidos agregados por Oasisbr también son recopilados por la "
La Referencia = "Red de Repositorios de Acceso Abierto a la Ciencia (LA Referencia)"
flow p4 = ", que a su vez es recopilada por el agregador europeo "
flow p5 = "Esta red de información permite a Oasisbr cumplir su misión principal de aumentar el impacto de la ciencia brasileña en todo el mundo."
