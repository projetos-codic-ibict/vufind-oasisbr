faq15 p1 = "The Brazilian Portal of Open Access Scientific Publications and Data – Oasisbr seeks to promote broad and inclusive access to the scientific information made available on its platform."

faq15 p2 = "The development and evolution of the Portal take into account good practices and digital accessibility guidelines, with the aim of enabling its content and functionalities to be used by as many people as possible, regardless of their abilities, devices, or assistive technologies."

faq15 p3 = "The new version of Oasisbr incorporates accessibility requirements related, among other aspects, to keyboard navigation, proper content structuring, identification of interface elements, contrast, readability, and compatibility with assistive technologies."

faq15 p4 = "Accessibility is an ongoing process. For this reason, the Portal may receive improvements as new needs, technological updates, or opportunities for enhancement are identified."

faq15 p5 = "If a user encounters any accessibility barrier while using Oasisbr, they are encouraged to report it to the team responsible for the Portal through the institutional support channels, providing, whenever possible, information about the page, functionality, or content where the difficulty occurred."

faq15 p6 = "For further information about the operation and use of the Portal, please also consult the Oasisbr Frequently Asked Questions (FAQ) section."

