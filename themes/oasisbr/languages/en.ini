privacy cookies heading = "Cookies and similar technologies"
privacy cookies p1 = "The Brazilian Portal of Open Access Scientific Publications and Data – Oasisbr uses cookies and similar technologies to ensure the platform works properly and to improve users’ browsing experience."
privacy cookies p2 = "Cookies are small files stored on the device used to access the Portal. They may perform different functions, such as retaining browsing preferences, enabling platform features to work properly and, where applicable, producing statistical information about use of the Portal."
privacy cookies categories intro = "The cookies used may be classified in the following categories:"
privacy cookies necessary label = "Necessary cookies:"
privacy cookies necessary description = "are essential to the proper operation of the Portal and the availability of its features. For this reason, they cannot be disabled through the Portal settings."
privacy cookies preference label = "Preference cookies:"
privacy cookies preference description = "when used, allow choices made during browsing to be retained, providing a more suitable user experience."
privacy cookies analytics label = "Analytics or performance cookies:"
privacy cookies analytics description = "when used, enable statistical information about use of the Portal to be collected, contributing to assessment and improvement of its services. Whenever applicable, their use is subject to the consent options made available to the user."
privacy cookies legal = "Oasisbr observes the principles of privacy, personal data protection and transparency set out in applicable Brazilian legislation, especially the General Personal Data Protection Law – LGPD (Law No. 13,709/2018)."

