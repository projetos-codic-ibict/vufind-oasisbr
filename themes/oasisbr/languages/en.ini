home_faq_full_text_question = "Does Oasisbr store full texts?"
home_faq_full_text_answer = "No. The portal collects and indexes metadata only. Full-text access is provided directly by the source repository or journal through the link in each record."
home_faq_update_question = "How often are records updated?"
home_faq_update_answer = "Data providers are harvested in regular cycles. New documents usually appear in the portal within 30 days."
home_faq_correction_question = "How can I correct incorrect metadata?"
home_faq_correction_answer = "The correction must be made in the source repository. After the update, the record is synchronized during the next harvest."
home_faq_reuse_question = "Can the portal data be reused?"
home_faq_reuse_answer = "Yes. Metadata is available for harvesting through OAI-PMH and may be reused in third-party services, provided the source is acknowledged."


dark heading = "dARK — Decentralized Archival Resource Key"
dark intro p1 = "dARK is an open, free initiative coordinated by Ibict and LA Referencia in collaboration with regional partners, extending the ARK (Archival Resource Key) identifier into a decentralized model for assigning and resolving PIDs, based on a permissioned blockchain network. Integrated into the Oasisbr ecosystem, dARK aims to expand persistent identifier coverage in Brazil and the Global South, reduce operational costs, strengthen shared governance, and ensure the persistence, provenance, and interoperability of records over time."
dark intro link = "Learn more about dARK on the official website"
dark features title = "Key features"
dark feature 1 = "Low cost and scalability for large-scale ARK assignment, with an emphasis on institutions in Global South countries."
dark feature 2 = "Interoperability with global ARK resolvers and coexistence with other PIDs (e.g., DOI), preserving links and references."
dark feature 3 = "Distributed governance in an institutional consortium, increasing resilience and fault tolerance."
dark feature 4 = "Transparency and provenance of metadata, supporting auditing, reproducibility, and long-term preservation."
dark purpose title = "Purpose within Oasisbr"
dark purpose li1 = "By integrating with Oasisbr, dARK enhances the visibility, reliability, and longevity of aggregated digital objects, aligning with Open Science practices and strengthening the national scholarly communication infrastructure."
dark purpose li2 part1 = "If your source is already part of Oasisbr, download the"
dark purpose li2 link = "dARK membership letter"
dark purpose li2 part2 = "and send it to the email"

lattes heading = "Lattes-Oasisbr Certification"
lattes what heading = "What is the certification?"
lattes what p1 = "Users of the Lattes Curriculum, from CNPq, have the option of having their theses and dissertations certified by Oasisbr - the Brazilian Open Access Portal for Scientific Publications and Data. More than one million Brazilian theses and dissertations from the Lattes Curriculum already automatically carry the Oasisbr seal."
lattes what p2 = "The certification seal is displayed in the user's curriculum information, in the academic/degree information and completed supervision sections. With the seal, it is possible to quickly and easily prove authorship/completed supervision of the thesis or dissertation and access the open access document on Oasisbr. The certificate can be issued automatically by the Lattes Curriculum or registered manually by the user."
lattes what p3 = "With the new feature, the Lattes CV will be able to check whether the thesis or dissertation entered in the researcher's curriculum is available in any academic database or repository. This will be the first step toward further certifications to come."
lattes howto heading = "How to add the Oasisbr seal to your Lattes Curriculum?"
lattes howto p1 = "A thesis or dissertation registered on the Lattes platform can only be certified if the document is included in the Oasisbr portal, so the user must first check the portal's website. Initially, Lattes certification via Oasisbr can be carried out for theses and dissertations defended and supervised by Brazilian graduate programs; certification of other document types will happen gradually."
lattes howto important label = "IMPORTANT!"
lattes howto important text = "The import will only be carried out if the title and publication year data match, both on Oasisbr and in your Lattes curriculum."
lattes howto p3 part1 = "If the document is not registered on the Oasis Portal, please notify the depositing institution and request that the repository be registered with our portal through the email"
lattes howto p4 = "When accessing your Lattes Curriculum editing area and entering the data for a thesis or dissertation, the researcher or academic can import information from Oasisbr using their Lattes ID or ORCID number and check which documents are registered on Oasisbr. Imported data already comes with the seal, which is automatically displayed on the public profile. By clicking the seal, the user can access the document on Oasisbr."
lattes howto download aria label = "Download the step-by-step guide for Lattes-Oasisbr certification (PDF file)"
lattes howto download link = "Download step-by-step guide (PDF)"

