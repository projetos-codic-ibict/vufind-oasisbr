# About page
about = "About"
about title = "The Oasisbr"
about p1 = "The Brazilian Open Access Publications and Scientific Data Portal (Oasisbr) is an initiative of the Brazilian Institute of Information in Science and Technology (Ibict) that brings together scientific production and research data in open access, published in scientific journals, digital repositories of scientific publications, digital repositories of research data and digital libraries of theses and dissertations."
about p2 = "In this way, Oasisbr aims to gather, give visibility and access to a good part of the scientific content produced by researchers working in Brazilian and Portuguese institutions, published in aggregating systems of production and scientific data."
about p3 = "Through a single interface, Oasisbr provides access to the most diverse types of documents that contain scientific information, namely: scientific articles, books, book chapters, conference articles, research data sets, preprints, dissertations, theses, graduation monographs, etc. In addition, Oasisbr also provides access to the scientific content present in the "
about link rcaap = "Open Access Scientific Repository of Portugal (RCAAP)"
and/or = " and/or "
declaring that the journal is open access = " declaring that the journal is open access"

# Goals
Goals = "Goals"
goal 1 = "Contribute to increasing the visibility of scientific production researchers from Brazilian and Portuguese institutions, nationally and internationally;"
goal 2 = "To offer the most different professionals involved with scientific communication, open and fast access to a large volume of scientific production and qualified research data sets;"
goal 3 = "To favor the increase of scientific exchange between researchers, nationally and internationally;"
goal 4 = "Stimulate the creation of open access scientific platforms, such as: scientific journals, digital repositories of scientific publications, digital repositories of research data and digital libraries of theses and dissertations;"
goal 5 = "Stimulate the adoption of Open Science practices in the context of national scientific communication;"
goal 6 = "Provide reliable data and information that avoid duplication of efforts and resources for research development;"
goal 7 = "Act as a national provider of open access scientific platforms, collecting and providing access to the most different types of documents;
"
#Flow
flow p1 = "To aggregate the national scientific production in open access into a single portal, Oasisbr uses a platform that, on a weekly basis, collects the content made available by the providers that integrate Oasisbr."
flow p2 = "The contents aggregated by Oasisbr are also collected by the "
flow p3 ="and, in the same way, the contents made available by RCAAP are collected by Oasisbr and made available to the Brazilian scientific community. The contents aggregated by Oasisbr are also collected by the "
flow p4 = ", which in turn is collected by the European aggregator "
La Referencia = "Network of Open Access Repositories for Science (LA Referencia)"
flow p5 = "This information network enables Oasisbr to fulfill its primary mission of increasing the impact of Brazilian Science around the world."
Oasisbr information flow = "Oasisbr information flow"

