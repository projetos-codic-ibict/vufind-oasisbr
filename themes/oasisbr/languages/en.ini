home_participate_step_publish_description = "Maintain a repository or journal portal with an active OAI-PMH interface and standardized Dublin Core metadata."
home_participate_step_request = "Request inclusion"
home_participate_step_request_description = "Send the registration form with the data provider URL and the institution's technical contacts."
home_participate_step_validate = "Validation and harvesting"
home_participate_step_validate_description = "The IBICT team validates metadata compliance and includes the source in the regular harvesting cycle."
home_request_membership = "Request inclusion"
home_help_title = "Frequently asked questions"
home_help_description = "Could not find what you needed? The Oasisbr team answers technical questions about metadata harvesting, source inclusion and portal use."
