home_about_kicker = "About the portal"
home_about_title = "A national aggregator maintained by IBICT since 2010"
home_about_description = "Oasisbr is a multidisciplinary search engine that provides open access to the scientific output of authors linked to Brazilian universities and research institutes. The portal also provides integrated access to Portuguese scientific output available through RCAAP."
home_about_metadata_description = "Metadata is collected automatically from participating data providers, normalized and made openly available, ensuring that each record links to the full text in the source repository."
