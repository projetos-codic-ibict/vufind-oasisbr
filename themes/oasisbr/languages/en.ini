faq1 p1 = "The Brazilian Open Access Portal for Scientific Publications and Data (Oasisbr) is an initiative of the Brazilian Institute of Information in Science and Technology (Ibict) that brings together open access scientific output and research data from several Brazilian and Portuguese universities and research institutions. Learn more about Oasisbr on the"
faq1 link sobre = "About"

faq2 p1a = "For your document to be collected by Oasisbr, it must be available in one of the scientific information sources harvested by the Portal. Check the"
faq2 p1b = "page to see if the source where your document was published is already part of Oasisbr."
faq2 p2 = "If the source where your document is located is not yet harvested by Oasisbr, we suggest that you first contact the source's manager so they can reach out to the Oasisbr Portal team."

faq3 p1a = "Each type of scientific information source has a distinct set of harvesting criteria, which can be found on the"
faq3 p1b = "page under “Criteria for harvesting information sources”. After the source manager checks the harvesting criteria, they should contact the Oasisbr Portal team through the"
faq3 link contato = "Contact"
faq3 p1c = "form and request enrollment in the Portal."

faq4 p1a = "By being harvested by Oasisbr, the information source and all the content it makes available gain national visibility, since Oasisbr brings together a large share of Brazilian scientific output in a single portal, and international visibility, since Oasisbr is harvested by major international aggregators and disseminated worldwide. Learn more about the “Oasisbr information flow” on the"

faq5 p1a = "Oasisbr harvests, disseminates, and provides access to all content made available on"
faq5 link bdtd = "Biblioteca Digital Brasileira de Teses e Dissertações (BDTD)"
faq5 p1b = ". Oasisbr also provides access to the scientific content available on"
faq5 link rcaap = "Repositório Científico de Acesso Aberto de Portugal (RCAAP)"
faq5 p1c = ", and the content made available by RCAAP is harvested by Oasisbr and presented to the Brazilian scientific community. Content aggregated by Oasisbr is also harvested by"
faq5 link lareferencia = "Rede de Repositorios de Acceso Abierto a la Ciencia (LA Referencia)"
faq5 p1d = ", which in turn is harvested by the European aggregator"
faq5 p1e = ". This information network allows Oasisbr to fulfill its core mission of increasing the impact of Brazilian science around the world."

faq6 p1 = "Oasisbr is not responsible for managing documents published and/or deposited in the information sources it harvests. Therefore, if you find a document you authored and believe it should not be on Oasisbr, contact the source where it was published directly. Only after the document's record is updated directly at the source will it stop appearing on Oasisbr."
faq6 p2 = "Please note that Oasisbr only harvests documents published in open access, and that all copyright-related matters are agreed upon directly between the author(s) and the source where the work was published and/or deposited."

faq7 p1 = "To export record data from Oasisbr, you first need to run a search to filter the desired records. From the search results, simply click the “Export” button found at the top and bottom of the search results page and provide an email address to receive the file; the records will then be sent to that email in CSV format."
faq7 p2a = "For reference management, we recommend using the free Zotero software. Zotero is compatible with Oasisbr and allows you to export documents and their references directly from the portal. Check out the"
faq7 link zotero manual = "simplified Zotero user manual"

faq8 p1 = "There are two ways to find the record of a scientific information source on Oasisbr. They are:"
faq8 li1a = "On the"
faq8 li1b = "page, located in the top menu, you can access all the scientific information sources harvested by Oasisbr using the search bar. You can search either “All sources” or specific source types."
faq8 li2a = "On the"
faq8 link pagina inicial = "Oasisbr home page"
faq8 li2b = ", with the search bar empty, click “Search”. Then use the “Institutions” and “Source title” filters on the left side of the results page. Finally, just identify your institution and/or your platform's source title."

faq9 p1a = "The Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) is a protocol developed by the"
faq9 link oai = "Open Archives Initiative"
faq9 p1b = "that defines a mechanism for harvesting metadata records from eprints, digital libraries, or any network server that wants to share or make visible the metadata of documents it stores so that external programs can collect them. This protocol was chosen by Oasisbr because it is a simple and efficient option for information sources to validate and harvest the metadata of files inserted into their platform."

faq10 p1a = "The guidelines of the Digital Repository Infrastructure Vision for European Research (DRIVE) guide the definition and completion of metadata to achieve greater interoperability and quality of exchanged information. In Oasisbr's case, we use the"
faq10 link drive vocab = "DRIVE controlled vocabulary"
faq10 p1b = "for the dc.type field — that is, for items available in the scientific publication repository to be validated and mirrored on the Portal, the dc.type field must be filled in according to the controlled vocabulary below:"

faq11 p1 = "Some of the most common problems identified when harvesting information sources are:"
faq11 li1 = "A change in the source page's web address (link);"
faq11 li2 = "An outdated OAI-PMH URL for the source;"
faq11 li3 = "Updates to the source's content (adding or removing files) without notifying the Oasisbr team;"
faq11 li4a = "Document indexing errors directly at the source, such as: harvesting operation errors with metadata; metadata that does not meet the required standard; not using the"
faq11 link drive list = "list of valid types from the DRIVE controlled vocabulary"
faq11 li4b = "; among others."
faq11 li5 = "Requiring a login and password to access files on the platform;"
faq11 li6 = "Errors or connection drops on the platform's server;"
faq11 li7 = "Institutional proxy blocking, preventing Oasisbr from harvesting."

faq12 p1a = "To contact one of our team members, send an email to"
faq12 p1b = "or call"
faq12 p1c = "(support available only from 10 AM to 12 PM and 2 PM to 4 PM, Brasília time)."

faq13 p1 = "The Brazilian Portal of Open Access Scientific Publications and Data – Oasisbr is an initiative of the Brazilian Institute of Information in Science and Technology (Ibict) aimed at bringing together and increasing the visibility of scientific production made available by institutions and information sources integrated into the Portal."

faq13 p2 = "Access to Oasisbr is public and free of charge."

faq13 p3 = "The information presented on the Portal is obtained from information sources integrated into Oasisbr and may undergo technical processes of collection, validation, transformation, normalization, and indexing to enable its integrated retrieval."

faq13 p4 = "Responsibility for the content of the documents, as well as for the accuracy and updating of the metadata originally provided, remains with the respective institutions and sources of origin."

faq13 p5 = "The use of content retrieved through Oasisbr must comply with the access, use, licensing, and copyright conditions established by the source responsible for the document."

faq13 p6 = "Users undertake to use the Portal lawfully and in accordance with its purpose, refraining from taking actions that could compromise its availability, security, or operation."

faq13 p7 = "For information about the operation of the Portal, integration of sources, content retrieval, and other matters related to the Portal, please also consult the Oasisbr Frequently Asked Questions (FAQ) section."

faq13 p8 = "For general information about rights and responsibilities related to Federal Government digital services, please also consult the"

faq learn more = "Learn more:"

faq13 learn more text = ""

faq13 govbr terms link = "Gov.br Terms of Use"

faq14 p1 = "The Brazilian Institute of Information in Science and Technology – Ibict recognizes the importance of privacy and the protection of personal data of users of the Brazilian Portal of Open Access Scientific Publications and Data – Oasisbr."

faq14 p2 = "Any processing of data carried out within the Portal complies with applicable Brazilian legislation, particularly Law No. 13,709/2018 – Brazilian General Data Protection Law (LGPD), as well as the principles of purpose, adequacy, necessity, transparency, security, and prevention."

faq14 p3 = "The primary purpose of Oasisbr is to enable the search and integrated access to scientific production made available by participating institutions and information sources. To this end, it performs automated processes for the collection, processing, normalization, and indexing of metadata from these sources."

faq14 p4 = "The metadata presented by Oasisbr originates from data-providing institutions. Therefore, requests related to the correction or updating of the original content may require changes to be made directly at the respective information source."

faq14 p5 = "During the use of the Portal, technical data necessary for its operation and the security of its services may be processed, as well as information stored through cookies. When cookies that are not strictly necessary are used, users will be provided with information about their purpose and, where applicable, mechanisms for managing their preferences."

faq14 p6 = "Oasisbr seeks to adopt technical and administrative measures aimed at protecting the information processed within the platform."

faq14 p7 = "For additional information about the operation of the Portal, log collection, and integration of information sources, please also consult the Oasisbr Frequently Asked Questions (FAQ) section."

faq14 learn more text = "General information about privacy and data protection in Federal Government digital services can be found in the"

faq14 privacy policy link = "Gov.br Privacy Policy"

faq14 page intro = "The Oasisbr Privacy Policy, including information about cookies, is available on this page."
faq14 page link = "Access the Privacy Policy"

